<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292" role="img" aria-labelledby="title desc">
  <title id="title">What Caliber delivers</title>
  <desc id="desc">Three outcomes: fresh agent context files, sync across Claude Cursor Codex OpenCode and Copilot, and optional Jev compaction that drops stale tool calls without summarizing.</desc>
  <rect width="960" height="292" rx="16" fill="#0a0a0a"/>

  <rect x="32" y="22" width="10" height="3" rx="1" fill="#fdba74"/>
  <rect x="29" y="28" width="16" height="3" rx="1" fill="#fb923c"/>
  <rect x="26" y="34" width="22" height="3" rx="1" fill="#f97316"/>
  <text x="56" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="0.16em" fill="#f97316">WHAT YOU GET</text>

  <rect x="24" y="56" width="288" height="212" rx="12" fill="#171717" stroke="#2a2a2a"/>
  <rect x="24" y="56" width="4" height="212" rx="2" fill="#f97316"/>
  <text x="48" y="88" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.12em" fill="#f97316">A  CONTEXT</text>
  <text x="48" y="116" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fafafa">Fresh agent files</text>
  <text x="48" y="148" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#e5e5e5">CLAUDE.md</text>
  <text x="48" y="168" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#e5e5e5">.cursor/rules/*.mdc</text>
  <text x="48" y="188" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#e5e5e5">AGENTS.md</text>
  <text x="48" y="208" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#e5e5e5">copilot-instructions.md</text>
  <text x="48" y="242" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a3a3a3">Accurate as the code changes</text>

  <path d="M322 162 l12 10 -12 10" fill="none" stroke="#404040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="344" y="56" width="272" height="212" rx="12" fill="#171717" stroke="#2a2a2a"/>
  <rect x="344" y="56" width="4" height="212" rx="2" fill="#fb923c"/>
  <text x="368" y="88" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.12em" fill="#fb923c">B  SYNC</text>
  <text x="368" y="116" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fafafa">Write a skill once</text>
  <text x="368" y="148" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e5e5e5">Claude Code</text>
  <text x="368" y="168" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e5e5e5">Cursor</text>
  <text x="368" y="188" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e5e5e5">Codex / OpenCode</text>
  <text x="368" y="208" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e5e5e5">GitHub Copilot</text>
  <text x="368" y="242" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a3a3a3">Native folders. No LLM.</text>

  <path d="M626 162 l12 10 -12 10" fill="none" stroke="#404040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="648" y="56" width="288" height="212" rx="12" fill="#171717" stroke="#2a2a2a"/>
  <rect x="648" y="56" width="4" height="212" rx="2" fill="#fdba74"/>
  <text x="672" y="88" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.12em" fill="#fdba74">C  COMPACT</text>
  <text x="672" y="116" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fafafa">No summarizing</text>
  <text x="672" y="148" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#4ade80">keep  user / assistant text</text>
  <text x="672" y="168" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#4ade80">keep  needed tool results</text>
  <text x="672" y="188" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#f87171">drop  stale tool calls</text>
  <text x="672" y="208" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#f87171">drop  stale tool results</text>
  <text x="672" y="242" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a3a3a3">Kept text stays verbatim</text>
</svg>
