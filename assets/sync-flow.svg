<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">caliber sync mirrors one skill into every agent</title>
  <desc id="desc">A skill written in Claude Code is mirrored by caliber sync into Cursor skills, Codex skills, OpenCode skills, and Copilot instruction files. No LLM.</desc>
  <rect width="960" height="340" rx="16" fill="#0a0a0a"/>

  <rect x="32" y="22" width="10" height="3" rx="1" fill="#fdba74"/>
  <rect x="29" y="28" width="16" height="3" rx="1" fill="#fb923c"/>
  <rect x="26" y="34" width="22" height="3" rx="1" fill="#f97316"/>
  <text x="56" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="0.16em" fill="#f97316">CALIBER SYNC</text>
  <text x="928" y="35" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#737373">no LLM  /  native format</text>

  <text x="40" y="72" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#737373">YOU WRITE ONCE</text>
  <rect x="24" y="84" width="300" height="92" rx="12" fill="#171717" stroke="#f97316" stroke-width="1.5"/>
  <text x="44" y="112" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fafafa">Claude Code</text>
  <text x="44" y="138" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#fdba74">.claude/skills/deploy/SKILL.md</text>
  <text x="44" y="158" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a3a3a3">source of truth</text>

  <rect x="392" y="100" width="176" height="60" rx="10" fill="#f97316"/>
  <text x="480" y="126" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700" fill="#0a0a0a">caliber sync</text>
  <text x="480" y="146" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#431407">mirrors, does not rewrite</text>

  <path d="M324 130 H384" stroke="#f97316" stroke-width="2" fill="none"/>
  <path d="M376 124 l8 6 -8 6" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M568 130 H620" stroke="#fb923c" stroke-width="2" fill="none"/>
  <path d="M612 124 l8 6 -8 6" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="636" y="72" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#737373">EVERY OTHER AGENT</text>

  <rect x="620" y="84" width="316" height="56" rx="10" fill="#171717" stroke="#2a2a2a"/>
  <text x="640" y="106" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fafafa">Cursor</text>
  <text x="640" y="126" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#e5e5e5">.cursor/skills/deploy/SKILL.md</text>

  <rect x="620" y="148" width="316" height="56" rx="10" fill="#171717" stroke="#2a2a2a"/>
  <text x="640" y="168" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fafafa">Codex</text>
  <text x="720" y="168" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e5e5e5">.agents/skills/...</text>
  <text x="640" y="188" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fafafa">OpenCode</text>
  <text x="720" y="188" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e5e5e5">.opencode/skills/...</text>

  <rect x="620" y="212" width="316" height="72" rx="10" fill="#171717" stroke="#2a2a2a"/>
  <text x="640" y="234" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fafafa">GitHub Copilot</text>
  <text x="640" y="254" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#e5e5e5">.github/instructions/</text>
  <text x="640" y="272" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">deploy.instructions.md</text>

  <text x="40" y="214" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a3a3a3">Providers are not symmetric.</text>
  <text x="40" y="234" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a3a3a3">Copilot has no skills folder -</text>
  <text x="40" y="254" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a3a3a3">a skill degrades to an instruction file.</text>
  <text x="40" y="286" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#737373">Hand edits are hashed and left alone until --force.</text>
  <text x="40" y="312" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#525252">caliber sync  --status  --dry-run  --from cursor</text>
</svg>
