<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Built-in summary vs Jev compaction</title>
  <desc id="desc">Left: a lossy summary where file paths, errors, and constraints disappear. Right: Jev drops stale tool calls and results while user and assistant text stay byte-for-byte verbatim.</desc>
  <rect width="960" height="420" rx="16" fill="#0a0a0a"/>

  <rect x="32" y="22" width="10" height="3" rx="1" fill="#fdba74"/>
  <rect x="29" y="28" width="16" height="3" rx="1" fill="#fb923c"/>
  <rect x="26" y="34" width="22" height="3" rx="1" fill="#f97316"/>
  <text x="56" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="0.16em" fill="#f97316">COMPACT WITHOUT SUMMARIZING</text>

  <text x="40" y="72" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#f87171">BUILT-IN SUMMARY</text>
  <rect x="24" y="84" width="444" height="300" rx="12" fill="#171717" stroke="#3f1d1d"/>

  <rect x="44" y="108" width="404" height="88" rx="8" fill="#1c1212"/>
  <text x="60" y="132" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d4d4d4">The user asked to fix a failing test.</text>
  <text x="60" y="152" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d4d4d4">The assistant read some files and</text>
  <text x="60" y="172" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d4d4d4">found an error, then proposed a fix.</text>

  <text x="60" y="224" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#737373">Gone from the summary</text>
  <text x="60" y="252" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#f87171" text-decoration="line-through">src/auth/session.ts</text>
  <text x="60" y="276" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#f87171" text-decoration="line-through">ECONNRESET</text>
  <text x="60" y="300" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#f87171" text-decoration="line-through">never edit src/generated</text>
  <text x="60" y="348" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a3a3a3">A path, an error, a constraint - vanished.</text>

  <text x="500" y="72" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#4ade80">JEV  /  CALIBER PLUGIN</text>
  <rect x="492" y="84" width="444" height="300" rx="12" fill="#171717" stroke="#14532d"/>

  <rect x="512" y="104" width="404" height="44" rx="6" fill="#0f1a12"/>
  <rect x="512" y="104" width="4" height="44" rx="2" fill="#4ade80"/>
  <text x="528" y="122" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#4ade80">KEEP  user</text>
  <text x="528" y="140" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#fafafa">Fix the failing test. Never edit src/generated.</text>

  <rect x="512" y="154" width="404" height="44" rx="6" fill="#0f1a12"/>
  <rect x="512" y="154" width="4" height="44" rx="2" fill="#4ade80"/>
  <text x="528" y="172" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#4ade80">KEEP  assistant</text>
  <text x="528" y="190" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#fafafa">I will read the test and the session helper.</text>

  <rect x="512" y="204" width="404" height="36" rx="6" fill="#1c1212"/>
  <rect x="512" y="204" width="4" height="36" rx="2" fill="#f87171"/>
  <text x="528" y="226" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#f87171">DROP  tool  Grep  pattern=TODO</text>

  <rect x="512" y="246" width="404" height="36" rx="6" fill="#1c1212"/>
  <rect x="512" y="246" width="4" height="36" rx="2" fill="#f87171"/>
  <text x="528" y="268" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#f87171">DROP  result  Bash  ls -la  (stale)</text>

  <rect x="512" y="288" width="404" height="44" rx="6" fill="#0f1a12"/>
  <rect x="512" y="288" width="4" height="44" rx="2" fill="#4ade80"/>
  <text x="528" y="306" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#4ade80">KEEP  user  /  verbatim</text>
  <text x="528" y="324" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#fafafa">still failing on ECONNRESET in session.ts</text>

  <text x="512" y="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a3a3a3">Stale tools go. Wording does not get rewritten.</text>
</svg>
